<script>
	function ChangeSImulation(Option){
		var selected = Option.value;
		if (selected=="Yes") {
			document.getElementById("SendSimulationUI").style.display="block";
		} else {
			document.getElementById("SendSimulationUI").style.display="none";
		}
	}
  </script>
  <script>
	function showPopup(type, message) {
    const popup = document.getElementById("popup");
    popup.style.display="block"
    const icon = document.getElementById("popup-icon");
    const text = document.getElementById("popup-message");

    // Set the message
    text.textContent = message;

    // Set the icon and style based on type
    if (type === "success") {
        icon.className = "fas fa-check-circle success"; // Success icon
    } else if (type === "failure") {
        icon.className = "fas fa-times-circle failure"; // Failure icon
    }

    // Show the popup
    popup.classList.remove("hidden");
}

function closePopup() {
    const popup = document.getElementById("popup");
    // popup.classList.add("hidden");
    popup.style.display="none";
}
  </script>
